<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the racing wheel -->
    <linearGradient id="wheelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#A50000;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#C70000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC143C;stop-opacity:1" />
    </linearGradient>

    <!-- Checkered flag pattern -->
    <pattern id="checkeredPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="10" height="10" fill="#000000"/>
      <rect x="10" y="10" width="10" height="10" fill="#000000"/>
      <rect x="10" y="0" width="10" height="10" fill="#FFFFFF"/>
      <rect x="0" y="10" width="10" height="10" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Checkered flag (flying/waving effect) -->
  <g>
    <!-- Flag wave shape -->
    <path 
      d="M 100 90 Q 130 80, 160 90 Q 190 100, 220 90 Q 250 80, 280 90 Q 310 100, 340 90 
         L 340 130 Q 310 140, 280 130 Q 250 120, 220 130 Q 190 140, 160 130 Q 130 120, 100 130 Z" 
      fill="url(#checkeredPattern)"
      stroke="#333333"
      stroke-width="2"
    />
    <!-- Flag shadow -->
    <ellipse cx="220" cy="145" rx="120" ry="8" fill="#000000" opacity="0.2"/>
  </g>

  <!-- Racing Wheel -->
  <g transform="translate(410, 110)">
    <!-- Outer tire with gradient -->
    <circle cx="0" cy="0" r="80" fill="url(#wheelGradient)"/>
    
    <!-- Tire texture lines -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="#5A0000" stroke-width="3"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#6A0000" stroke-width="2"/>
    
    <!-- Inner rim -->
    <circle cx="0" cy="0" r="65" fill="#1a1a1a"/>
    
    <!-- Rim spokes (5 spokes design) -->
    <g opacity="0.9">
      <!-- Spoke 1 -->
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#666666" stroke-width="8" stroke-linecap="round"/>
      <!-- Spoke 2 -->
      <line x1="-47.5" y1="-15.5" x2="47.5" y2="15.5" stroke="#666666" stroke-width="8" stroke-linecap="round"/>
      <!-- Spoke 3 -->
      <line x1="-47.5" y1="15.5" x2="47.5" y2="-15.5" stroke="#666666" stroke-width="8" stroke-linecap="round"/>
      <!-- Spoke 4 -->
      <line x1="-29.4" y1="-40.5" x2="29.4" y2="40.5" stroke="#666666" stroke-width="8" stroke-linecap="round"/>
      <!-- Spoke 5 -->
      <line x1="-29.4" y1="40.5" x2="29.4" y2="-40.5" stroke="#666666" stroke-width="8" stroke-linecap="round"/>
    </g>
    
    <!-- Center hub -->
    <circle cx="0" cy="0" r="25" fill="#C70000"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#8B0000" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="#1a1a1a"/>
    <circle cx="0" cy="0" r="10" fill="#333333"/>
    
    <!-- Shine effect on wheel -->
    <ellipse cx="-20" cy="-25" rx="15" ry="25" fill="#FFFFFF" opacity="0.2" transform="rotate(-30 -20 -25)"/>
  </g>

  <!-- Motion speed lines -->
  <g opacity="0.6">
    <line x1="520" y1="70" x2="560" y2="70" stroke="#C70000" stroke-width="4" stroke-linecap="round"/>
    <line x1="525" y1="85" x2="565" y2="85" stroke="#C70000" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="520" y1="100" x2="560" y2="100" stroke="#C70000" stroke-width="4" stroke-linecap="round"/>
    <line x1="528" y1="115" x2="568" y2="115" stroke="#C70000" stroke-width="3" stroke-linecap="round"/>
    <line x1="525" y1="130" x2="565" y2="130" stroke="#C70000" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="532" y1="145" x2="572" y2="145" stroke="#C70000" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Text: "Race ops" -->
  <text 
    x="50" 
    y="270" 
    font-family="'Eurostile', 'Impact', 'Arial Black', sans-serif" 
    font-size="90" 
    font-weight="900" 
    fill="#2B2B2B"
    letter-spacing="-2"
  >
    Race ops
  </text>

  <!-- Text: "F1 MISSION CONTROL" -->
  <text 
    x="72" 
    y="310" 
    font-family="'Arial', 'Helvetica', sans-serif" 
    font-size="28" 
    font-weight="700" 
    fill="#8B0000"
    letter-spacing="8"
  >
    F1 MISSION CONTROL
  </text>

  <!-- Subtle shadow under text for depth -->
  <ellipse cx="300" cy="325" rx="250" ry="10" fill="#000000" opacity="0.1"/>
</svg>
